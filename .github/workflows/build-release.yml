name: Build and Release LuiseStore

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release
      - develop
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            scheme: rootless
            make_target: ci-build
          - name: lite
            scheme: rootless
            make_target: make_luisestore_lite
          - name: roothide
            scheme: roothide
            make_target: luisestore_lite_roothide

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
      FINALPACKAGE: 1

    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/dpkg
            /opt/homebrew/Cellar/ldid-procursus
            /opt/homebrew/Cellar/make
            /opt/homebrew/Cellar/openssl@3
            /opt/homebrew/Cellar/libarchive
            /opt/homebrew/Cellar/libplist
            /opt/homebrew/Cellar/libb2
          key: ${{ runner.os }}-homebrew-${{ hashFiles('.github/workflows/build-release.yml') }}-dpkg-ldid-procursus-make-openssl3-libarchive-libplist-libb2
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Install system dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          # Update PATH to use GNU make instead of BSD make
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH

          # Install required packages via Homebrew
          brew install dpkg ldid-procursus make openssl@3 libarchive libplist libb2

          # Link packages that may not be linked by default
          brew link --overwrite dpkg || true
          brew link --overwrite ldid-procursus || true
          brew link --overwrite make || true
          brew link --force --overwrite libarchive || true
          brew link --force --overwrite libplist || true
          brew link --force --overwrite libb2 || true

      - name: Cache THEOS framework
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-roothide-theos-${{ hashFiles('.github/workflows/build-release.yml') }}-master-owngoal
          restore-keys: |
            ${{ runner.os }}-roothide-theos-

      - name: Checkout THEOS framework
        if: steps.cache-theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: OwnGoalStudio/theos-roothide
          ref: master
          path: theos
          submodules: recursive

      - name: Install iOS SDKs
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos/sdks
          sparse-checkout: |
            iPhoneOS14.5.sdk
            iPhoneOS16.5.sdk

      - name: Build ${{ matrix.name }}
        timeout-minutes: 45
        run: |
          make VERBOSE=1 ${{ matrix.make_target }}

      - name: Verify roothide helper links libroothide
        if: matrix.name == 'roothide'
        run: |
          BIN=./RootHelper/.theos/obj/arm64/luisestorehelper_lite
          if [ ! -f "$BIN" ]; then
            echo "ERROR: $BIN not found after build"
            exit 1
          fi
          if ! strings "$BIN" | grep -q "libroothide.dylib"; then
            echo "ERROR: luisestorehelper_lite is NOT linked against libroothide.dylib"
            echo "rootfs()/jbroot() fall back to no-op stubs -> ldid gets wrong paths -> error 175"
            exit 1
          fi
          echo "OK: helper linked with libroothide.dylib"

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.name }}-${{ github.sha }}
          path: |
            RootHelper/.theos/obj/arm64/luisestorehelper_lite
            RootHelper/.theos/obj/arm64/luisestorehelper
            **/.theos/obj/
          retention-days: 30
          if-no-files-found: warn

      - name: Collect artifacts (${{ matrix.name }})
        run: |
          mkdir -p artifacts
          case "${{ matrix.name }}" in
            main)
              cp -v _build/*.tar artifacts/ 2>/dev/null || true
              find . -type f -name "*.deb" \( -path "*/.theos/packages/*" -o -path "*/packages/*" \) \
                ! -path "./LuiseStoreLite/*" ! -path "./LuiseStoreLiteRoothide/*" \
                -exec cp -v {} artifacts/ \;
              ;;
            lite)
              find ./LuiseStoreLite -type f -name "*.deb" \( -path "*/.theos/packages/*" -o -path "*/packages/*" \) \
                -exec cp -v {} artifacts/ \;
              ;;
            roothide)
              # RootHide shares the regular Lite package ID/version, give it a stable unique name
              find ./LuiseStoreLiteRoothide -type f -name "*.deb" \( -path "*/.theos/packages/*" -o -path "*/packages/*" \) \
                -exec cp -v {} artifacts/LuiseStoreLiteRoothide.deb \;
              test -f artifacts/LuiseStoreLiteRoothide.deb
              ;;
          esac

      - name: List collected artifacts
        run: |
          echo "Collected artifacts:"
          ls -lh artifacts/
          echo "Total artifacts: $(ls -1 artifacts/ | wc -l)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luisestore-build-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: |
      success() && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/release' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: luisestore-build-*
          merge-multiple: true
          path: artifacts

      - name: List downloaded artifacts
        run: |
          ls -lh artifacts/
          echo "Total artifacts: $(ls -1 artifacts/ | wc -l)"

      - name: Extract version information
        id: version
        run: |
          # Try to extract version from git tag first
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Extract version from tag (remove 'refs/tags/v' prefix)
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Version extracted from git tag: $VERSION"
          else
            # Fallback: Extract version from Info.plist
            PLIST_PATH="LuiseStore/Resources/Info.plist"
            if [ -f "$PLIST_PATH" ]; then
              VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST_PATH" 2>/dev/null || echo "")
              if [ -z "$VERSION" ]; then
                VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST_PATH" 2>/dev/null || echo "unknown")
              fi
              echo "Version extracted from Info.plist: $VERSION"
            else
              echo "Warning: Info.plist not found, using 'unknown' as version"
              VERSION="unknown"
            fi
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Final version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.VERSION) }}
          name: LuiseStore v${{ env.VERSION }}
          body: |
            ## LuiseStore v${{ env.VERSION }}

            Automated build from commit ${{ github.sha }}

            ### Build Information
            - **Branch/Tag**: ${{ github.ref_name }}
            - **Commit**: ${{ github.sha }}
            - **Build Date**: ${{ github.event.head_commit.timestamp }}

            ### Artifacts
            - LuiseStore.tar - Main LuiseStore package
            - LuiseStoreLite deb package
            - LuiseStoreLiteRoothide.deb - RootHide package
            - Helper and PersistenceHelper deb packages

            Note: Installer IPAs are not included in automated builds as they require a victim IPA.

            ### Installation
            Please refer to the [LuiseStore documentation](https://github.com/luisepog/LuiseStore) for installation instructions.
          draft: false
          prerelease: ${{ contains(env.VERSION, '-beta') || contains(env.VERSION, '-rc') || contains(env.VERSION, '-alpha') }}
          files: |
            artifacts/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
